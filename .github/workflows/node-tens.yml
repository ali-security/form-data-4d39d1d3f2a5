name: 'Tests: node.js >= 10'

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test filter to scope the run'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [23, 22, 20, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin the registry time machine to the release date
        run: npm config set registry "https://:2025-02-14T23%3A23%3A57.699Z@time-machines-npm.sealsecurity.io/"
      - run: npm install --no-audit --no-fund
      - name: Run the test suite
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            SEAL_TEST_FILTER='${{ inputs.test-filter }}' npm run tests-only
          else
            npm run ci-test
          fi

  pack:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: form-data-tgz
          path: form-data-4.0.2.tgz
          if-no-files-found: error
